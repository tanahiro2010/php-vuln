# Hifumi Secure Shop -- shared Apache VirtualHost for both training apps.
#
# The DOCROOT env var (set per docker-compose service) selects which
# app this container serves:
#   DOCROOT=/var/www/training/docroot/vulnerable
#   DOCROOT=/var/www/training/docroot/secure
#
# FallbackResource sends every non-file request to /index.php, which
# is a thin dispatcher that includes app_vulnerable.php or app_secure.php.
# Static assets (style.css, app.js) live in a shared directory and are
# exposed via Alias so both apps serve them from / without duplication.

<VirtualHost *:80>
    ServerName localhost

    DocumentRoot ${DOCROOT}

    # Static assets shared by both apps.
    Alias /style.css /var/www/training/static/style.css
    Alias /app.js    /var/www/training/static/app.js

    <Directory ${DOCROOT}>
        AllowOverride None
        Require all granted

        # Any URL that does NOT match a real file (or the aliases above)
        # is served by /index.php, which delegates to the real router.
        FallbackResource /index.php

        # Directory listings must never leak the front-controller layout
        # to a demo audience.
        Options -Indexes
    </Directory>

    <Directory /var/www/training/static>
        Require all granted
        Options -Indexes
    </Directory>

    # Prevent Apache from serving PHP source files outside DocumentRoot
    # if the DOCROOT variable is ever mis-set. (Belt and braces.)
    <Directory /var/www/training/lib>
        Require all denied
    </Directory>
    <Directory /var/www/training/mysql>
        Require all denied
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/training-error.log
    CustomLog ${APACHE_LOG_DIR}/training-access.log combined
</VirtualHost>
